* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--brand); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.top :focus-visible { outline-color: var(--on-brand); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.num, td, .tab { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- barra superior ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--brand); color: var(--on-brand); border-bottom: 3px solid var(--board); }
.top .wrap { display: flex; align-items: center; gap: 20px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; flex: none; }
.brand-name { font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: .02em; text-transform: uppercase; line-height: 1; }
.brand-name b { color: inherit; font-weight: 900; }
.crest-top { width: 30px; }
.nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-left: auto; min-width: 0; }
.nav::-webkit-scrollbar { display: none; }
.nav button { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; padding: 8px 12px; border-radius: 6px; color: var(--on-brand); opacity: .78; white-space: nowrap; }
.nav button:hover { opacity: 1; background: rgba(18, 18, 18, .08); }
.nav button[aria-current="page"] { color: var(--brand); background: var(--board); opacity: 1; }
@media (max-width: 680px) {
  .top .wrap { flex-direction: column; align-items: stretch; gap: 8px; }
  .nav { margin-left: 0; }
  .nav button { padding: 7px 9px; font-size: 11px; letter-spacing: .04em; }
}

/* ---------- tipografía y piezas comunes ---------- */
.eyebrow { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.h2 { font-family: var(--font-display); font-weight: 800; font-size: clamp(30px, 4.2vw, 40px); line-height: .95; text-transform: uppercase; letter-spacing: .01em; }
.h3 { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1; text-transform: uppercase; letter-spacing: .02em; }
.sub { color: var(--ink-2); max-width: 62ch; }
.small { font-size: 13px; color: var(--muted); }
main { padding-block: 28px 64px; display: grid; gap: 40px; }
section { display: grid; gap: 16px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 900px) { .grid-2 { grid-template-columns: minmax(0, 1fr); } .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .grid-3 { grid-template-columns: minmax(0, 1fr); } }
.link { color: var(--accent); font-weight: 600; text-decoration: underline; text-decoration-color: var(--brand); text-decoration-thickness: 3px; text-underline-offset: 3px; }
.pname { font-weight: 600; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.pname:hover { text-decoration-color: var(--brand); text-decoration-thickness: 3px; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.tag.gold { background: var(--brand-soft); color: var(--on-soft); }
.res { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; font-family: var(--font-display); font-weight: 800; font-size: 16px; flex: none; }
.res.V { background: var(--win-soft); color: var(--win); }
.res.E { background: var(--draw-soft); color: var(--draw); }
.res.D { background: var(--loss-soft); color: var(--loss); }
.res.x { background: var(--surface-2); color: var(--muted); }
.form { display: flex; gap: 4px; flex-wrap: wrap; }
.form .res { width: 22px; height: 22px; font-size: 14px; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { font-family: var(--font-mono); font-size: 12.5px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); }
.pill:hover { border-color: var(--ink-2); }
.pill[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); border-color: var(--on-brand); font-weight: 500; }
.empty { padding: 18px; border: 1px dashed var(--line); border-radius: var(--radius); color: var(--muted); }

/* ---------- portada ---------- */
.hero { display: grid; gap: 22px; padding-top: 4px; }
.hero-row { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 900px) { .hero-row { grid-template-columns: minmax(0, 1fr); } }
.hero-id { display: grid; gap: 12px; }
.hero-id { grid-template-columns: auto minmax(0, 1fr); align-items: end; gap: 26px; }
.crest-hero { width: clamp(92px, 13vw, 160px); }
.hero-title { display: grid; gap: 12px; min-width: 0; }
@media (max-width: 560px) { .hero-id { grid-template-columns: minmax(0, 1fr); gap: 16px; } }
.hero h1 { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; font-size: clamp(44px, 9vw, 116px); line-height: .82; letter-spacing: -.005em; overflow-wrap: anywhere; }
.hero h1 span { background: var(--brand); color: var(--on-brand); padding: .06em .12em 0; display: inline-block; line-height: .85; }
.ledger { display: flex; flex-wrap: wrap; gap: 0; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--line); }
.ledger div { padding: 10px 14px 10px 0; margin-right: 14px; border-right: 1px solid var(--line); display: grid; }
.ledger div:last-child { border-right: 0; }
.ledger b { font-family: var(--font-display); font-size: 30px; font-weight: 800; line-height: 1; }

<script>
(() => {
const D = JSON.parse(document.getElementById('data').textContent);
const P = D.players;
const M = D.matches;
const MB = Object.fromEntries(M.map(m => [m.id, m]));
const S = D.seasons;
const SB = Object.fromEntries(S.map(s => [s.id, s]));
const CUR = S.find(s => s.current).id;
const VIEWS = ['inicio', 'temporadas', 'partidos', 'jugadores', 'records'];
const US = 'Florentineza SA';
const state = { view: null, season: CUR, sort: {}, pf: { s: 'todas', c: 'todas', r: 'todos', q: '' }, jf: 'plantilla', js: 'g', jornada: {}, h2hq: '' };

const MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const MESL = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function dp(d) { const [a, b] = d.split('T'); const [y, mo, da] = a.split('-').map(Number); return { y, mo, da, hm: b || '', wd: new Date(Date.UTC(y, mo - 1, da)).getUTCDay() }; }
const fdate = d => { const p = dp(d); return `${p.da} ${MES[p.mo - 1]} ${p.y}`; };
const flong = d => { const p = dp(d); return `${DIAS[p.wd]} ${p.da} de ${MESL[p.mo - 1]} de ${p.y}, ${p.hm} h`; };
const pname = k => P[k] ? P[k].n : '—';
const nick = k => P[k] ? (P[k].nick || P[k].n.split(' ')[0]) : '—';
function dorsal(k, s) { const p = P[k]; if (!p) return ''; if (s && p.dorsales && p.dorsales[s] != null) return String(p.dorsales[s]); return p.dorsal ? String(p.dorsal) : ''; }
const isOff = m => m.c !== 'A' && m.r;
const comp = m => m.c === 'L' ? `Liga · J${m.j ?? '?'}` : m.c === 'A' ? 'Amistoso' : m.c === 'FD' || m.c === 'FI' ? `${m.c === 'FD' ? 'Fase Distrito' : 'Interdistritos'} · ${m.rd}` : `${m.cn}${m.rd ? ' · ' + m.rd : ''}`;
const pct = (a, b) => b ? a / b : 0;
const f2 = x => x.toFixed(2).replace('.', ',');
const plink = k => `<button class="pname" data-p="${k}">${esc(pname(k))}</button>`;
const ord = n => n ? `${n}º` : '—';

function teamsHTML(m, short = true) {
  const usName = short ? 'FSA' : 'Florentineza';
  const home = m.h ? usName : m.o, away = m.h ? m.o : usName;
  const hs = m.h ? m.gf : m.ga, as = m.h ? m.ga : m.gf;
  const sc = hs == null ? 'vs' : `${hs}–${as}`;
  return `<span class="${m.h ? 'us' : ''}">${esc(home)}</span><span class="sc">${sc}</span><span class="${m.h ? '' : 'us'}">${esc(away)}</span>`;
}
function scorersLine(m) {
  const g = Object.entries(m.g).sort((a, b) => b[1] - a[1]).map(([k, n]) => nick(k) + (n > 1 ? ' ' + n : ''));
  if (m.og) g.push('p.p.' + (m.og > 1 ? ' ' + m.og : ''));
  return g.join(', ');
}
function mrow(m) {
  const p = dp(m.d);
  const sub = scorersLine(m);
  return `<button class="mrow" data-m="${m.id}">
    <span class="mrow-date">${p.da} ${MES[p.mo - 1]}<br>${p.y}</span>
    <span class="mrow-comp">${esc(comp(m))}</span>
    <span class="mrow-main"><span class="teams">${teamsHTML(m)}</span>${sub ? `<span class="mrow-sub">Goles: ${esc(sub)}</span>` : m.ff ? '<span class="mrow-sub">Incomparecencia del rival</span>' : ''}</span>
    <span class="res ${m.r || 'x'}" aria-label="${m.r === 'V' ? 'Victoria' : m.r === 'E' ? 'Empate' : m.r === 'D' ? 'Derrota' : 'Pendiente'}">${m.r || '·'}</span>
  </button>`;
}

/* ---------- agregados ---------- */
function career(k) {
  const t = { g: 0, a: 0, pj: 0, mvp: 0, mvpsd: 0, ge: 0, seasons: [] };
  for (const s of S) {
    const r = s.players[k];
    if (!r) continue;
    t.g += r.g || 0; t.a += r.a || 0; t.pj += r.pj || 0; t.mvp += r.mvp || 0; t.mvpsd += r.mvpsd || 0;
    if (typeof r.ge === 'number') t.ge += r.ge;
    t.seasons.push(s.id);
  }
  t.gkm = M.filter(m => m.gk && k in m.gk).length;
  t.cs = M.filter(m => isOff(m) && m.gk && m.gk[k] === 0 && Object.keys(m.gk).length === 1).length;
  return t;
}
const CAREER = Object.fromEntries(Object.keys(P).map(k => [k, career(k)]));
const SQUAD = new Set(M.filter(m => m.s === CUR).flatMap(m => [...m.conv, ...m.aus]).map(String));
function rec(list) { return { n: list.length, v: list.filter(m => m.r === 'V').length, e: list.filter(m => m.r === 'E').length, d: list.filter(m => m.r === 'D').length, gf: list.reduce((a, m) => a + m.gf, 0), ga: list.reduce((a, m) => a + m.ga, 0) }; }

/* ---------- gráficos ---------- */
function trajectoryChart() {
  const W = 640, H = 230, L = 44, R = 20, T = 30, B = 44;
  const n = S.length, bw = (W - L - R) / n;
  const x = i => L + bw * (i + .5);
  const y = p => T + (p - 1) / 11 * (H - T - B);
  let g = '';
  for (const p of [1, 4, 8, 12]) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(p)}" y2="${y(p)}"/><text x="${L - 10}" y="${y(p) + 4}" text-anchor="end">${p}º</text>`;
  const pts = S.map((s, i) => [x(i), y(s.pos || 12), s]).filter(p => p[2].pos);
  g += `<polyline points="${pts.map(p => p[0] + ',' + p[1]).join(' ')}" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round"/>`;
  pts.forEach(([px, py, s], i) => {
    const cur = s.current;
    const pts_ = D.leagues[s.id].table.find(r => r.t === US)?.pts;
    g += `<g><title>${s.id}: ${s.pos}º de ${s.nteams} · ${pts_} pts${cur ? ' (en curso)' : ''}</title>
      <circle cx="${px}" cy="${py}" r="14" fill="transparent"/>
      <circle cx="${px}" cy="${py}" r="7" fill="${cur ? 'var(--board)' : 'var(--brand)'}" stroke="${cur ? 'var(--brand)' : 'var(--board)'}" stroke-width="${cur ? 2.5 : 2}"/>
      <text class="lbl" x="${px}" y="${py - 14}" text-anchor="middle">${s.pos}º</text>
      <text x="${px}" y="${H - B + 22}" text-anchor="middle">${s.id}</text>
      ${s.titles.length ? `<text x="${px}" y="${H - B + 37}" text-anchor="middle" style="fill:var(--brand);font-weight:500">CAMPEÓN</text>` : cur ? `<text x="${px}" y="${H - B + 37}" text-anchor="middle">en curso</text>` : ''}</g>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Posición final en liga por temporada">${g}</svg>`;
}
function groupedBars(rows, series, { W = 640, H = 240, label = '' } = {}) {
  const L = 34, R = 10, T = 22, B = 30;
  const max = Math.max(1, ...rows.flatMap(r => series.map(s => r[s.key])));
  const step = max > 60 ? 25 : max > 24 ? 10 : max > 10 ? 5 : 2;
  const top = Math.ceil(max / step) * step;
  const y = v => T + (1 - v / top) * (H - T - B);
  const gw = (W - L - R) / rows.length;
  const bw = Math.min(26, (gw - 14) / series.length - 2);
  let g = '';
  for (let v = 0; v <= top; v += step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  rows.forEach((r, i) => {
    const cx = L + gw * (i + .5);
    const total = series.length * bw + (series.length - 1) * 2;
    series.forEach((s, j) => {
      const v = r[s.key], bx = cx - total / 2 + j * (bw + 2), by = y(v), bh = y(0) - by;
      const rr = Math.min(3, bh);
      g += `<g><title>${esc(r.label)} · ${s.name}: ${v}</title>`;
      if (v > 0) g += `<path d="M${bx},${y(0)} V${by + rr} Q${bx},${by} ${bx + rr},${by} H${bx + bw - rr} Q${bx + bw},${by} ${bx + bw},${by + rr} V${y(0)} Z" fill="${s.color}"/>`;
      g += `<text x="${bx + bw / 2}" y="${by - 5}" text-anchor="middle" style="fill:var(--board-ink)">${v}</text></g>`;
    });
    g += `<text x="${cx}" y="${H - B + 18}" text-anchor="middle">${esc(r.label)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}</svg>`;
}

function sortTable(id, cols, rows, defKey, rowCls = () => '') {
  const st = state.sort[id] || { k: defKey, d: -1 };
  const col = cols.find(c => c.k === st.k) || cols[0];
  const sorted = [...rows].sort((a, b) => {
    const va = col.v(a), vb = col.v(b);
    const c = col.str ? String(va).localeCompare(String(vb), 'es') : (va ?? -Infinity) - (vb ?? -Infinity);
    return st.d * c;
  });
  return `<div class="tbl-wrap"><table><thead><tr>${cols.map(c => `<th class="${c.l ? 'l' : ''}">${c.nosort ? c.h : `<button data-sort="${id}:${c.k}" ${st.k === c.k ? `aria-sort="${st.d === -1 ? 'descending' : 'ascending'}"` : ''}>${c.h}${st.k === c.k ? (st.d === -1 ? ' ↓' : ' ↑') : ''}</button>`}</th>`).join('')}</tr></thead>
  <tbody>${sorted.map(r => `<tr class="${rowCls(r)}">${cols.map(c => `<td class="${c.l ? 'l' : ''} ${c.strong ? 'strong' : ''}">${c.f ? c.f(r) : esc(c.v(r))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

    ['Partidos jugados', c => c.pj], ['MVP', c => c.mvp], ['MVP sin derrota', c => c.mvpsd],
  ];
  const off = M.filter(isOff).sort((a, b) => a.d.localeCompare(b.d));
  const played = off.filter(m => !m.ff);
  const bigW = [...played].sort((a, b) => (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf)[0];
  const bigL = [...played].sort((a, b) => (a.gf - a.ga) - (b.gf - b.ga))[0];
  let run = 0, best = 0, bestEnd = null, wrun = 0, wbest = 0;
  for (const m of off) { if (m.r !== 'D') { run++; if (run > best) { best = run; bestEnd = m; } } else run = 0; if (m.r === 'V') { wrun++; wbest = Math.max(wbest, wrun); } else wrun = 0; }
  const cs = off.filter(m => m.ga === 0 && !m.ff).length;
  const perf = [];
  for (const m of off) for (const [k, n] of Object.entries(m.g)) if (n >= 4) perf.push({ k, n, m });
  perf.sort((a, b) => b.n - a.n || b.m.d.localeCompare(a.m.d));
  const hat = off.reduce((a, m) => a + Object.values(m.g).filter(n => n >= 3).length, 0);
  const seasonsDone = S.filter(s => !s.current);
  const ptsOf = s => D.leagues[s.id]?.table.find(t => t.t === US)?.pts ?? 0;
  const bestSeason = [...seasonsDone].filter(s => s.league.n).sort((a, b) => ptsOf(b) / b.league.n - ptsOf(a) / a.league.n)[0];
  const bsPts = ptsOf(bestSeason);
  // cara a cara
  const h2h = {};
  for (const m of M.filter(m => m.r)) { const o = h2h[m.o] ||= { o: m.o, n: 0, v: 0, e: 0, d: 0, gf: 0, ga: 0, last: null }; o.n++; o[m.r.toLowerCase()]++; o.gf += m.gf; o.ga += m.ga; if (!o.last || m.d > o.last.d) o.last = m; }
  const q = state.h2hq.trim().toLowerCase();
  const h2hRows = Object.values(h2h).filter(r => !q || r.o.toLowerCase().includes(q));
  const series = [{ key: 'gf', name: 'Goles a favor', color: 'var(--brand)' }, { key: 'ga', name: 'Goles en contra', color: 'var(--slate)' }];
  const rows = S.map(s => ({ label: s.id, ...rec(M.filter(m => m.s === s.id && isOff(m))) }));
  return `
  <section>
    <p class="eyebrow">Récords</p>
    <h2 class="h2">Los números del club</h2>
    <p class="sub">Partidos oficiales de liga y copa desde 2021. Los amistosos no cuentan, igual que en el Excel.</p>
  </section>
  <section>
    <div class="facts">
      <button class="fact" data-m="${bigW.id}"><span class="eyebrow">Mayor goleada</span><b>${bigW.h ? bigW.gf + '–' + bigW.ga : bigW.ga + '–' + bigW.gf}</b><span class="small">${esc(bigW.h ? 'Florentineza – ' + bigW.o : bigW.o + ' – Florentineza')} · ${fdate(bigW.d)}</span></button>
      <button class="fact" data-m="${bigL.id}"><span class="eyebrow">Peor derrota</span><b>${bigL.h ? bigL.gf + '–' + bigL.ga : bigL.ga + '–' + bigL.gf}</b><span class="small">${esc(bigL.h ? 'Florentineza – ' + bigL.o : bigL.o + ' – Florentineza')} · ${fdate(bigL.d)}</span></button>
      <div class="fact"><span class="eyebrow">Racha sin perder</span><b>${best}</b><span class="small">partidos oficiales seguidos, hasta ${bestEnd ? fdate(bestEnd.d) : '—'}</span></div>
      <div class="fact"><span class="eyebrow">Victorias seguidas</span><b>${wbest}</b><span class="small">mejor racha de triunfos oficiales</span></div>
      <div class="fact"><span class="eyebrow">Porterías a cero</span><b>${cs}</b><span class="small">en ${played.length} partidos oficiales disputados</span></div>
      <button class="fact" data-season="${bestSeason.id}"><span class="eyebrow">Mejor temporada</span><b>${f2(bsPts / bestSeason.league.n)}</b><span class="small">puntos por partido en ${bestSeason.id} (${bsPts} pts en ${bestSeason.league.n} jornadas)</span></button>
      <div class="fact"><span class="eyebrow">Hat-tricks</span><b>${hat}</b><span class="small">partidos con 3 o más goles de un jugador</span></div>
      ${perf[0] ? `<button class="fact" data-m="${perf[0].m.id}"><span class="eyebrow">Más goles en un partido</span><b>${perf[0].n}</b><span class="small">${esc(pname(perf[0].k))} · vs ${esc(perf[0].m.o)}, ${fdate(perf[0].m.d)}</span></button>` : ''}
    </div>
  </section>
  <section>
    <h3 class="h3">Clasificaciones históricas</h3>
    <div class="grid-3">${boards.map(([t, f]) => { const rows_ = top(f); return `<div class="panel" style="display:grid;gap:10px"><h3 class="eyebrow" style="color:var(--ink)">${t}</h3><div class="board-list">${rows_.map(([k, v], i) => lbRow(i + 1, k, v, rows_[0][1])).join('')}</div></div>`; }).join('')}</div>
  </section>
  <section>
    <div class="panel-head"><h3 class="h3">Goles por temporada</h3>${legend(series)}</div>
    <div class="chartpanel">${groupedBars(rows, series, { label: 'Goles a favor y en contra por temporada' })}</div>
  </section>
  <section>
    <div class="panel-head"><h3 class="h3">Exhibiciones</h3><span class="small">Partidos con 4 o más goles de un mismo jugador</span></div>
    <div class="mlist">${perf.map(x => `<button class="mrow" data-m="${x.m.id}"><span class="mrow-date">${fdate(x.m.d).replace(/ (\d{4})$/, '<br>$1')}</span><span class="mrow-comp">${esc(comp(x.m))}</span><span class="mrow-main"><span class="teams"><span class="us">${esc(pname(x.k))}</span><span class="sc">${x.n}</span><span>goles vs ${esc(x.m.o)}</span></span></span><span class="res ${x.m.r}">${x.m.r}</span></button>`).join('')}</div>
  </section>
  <section>
    <div class="panel-head"><h3 class="h3">Cara a cara</h3><label class="fld" for="h2h-q">Rival<input id="h2h-q" type="search" data-h2h placeholder="Buscar rival" value="${esc(state.h2hq)}"></label></div>
    ${sortTable('h2h', [
      { k: 'o', h: 'Rival', l: 1, str: 1, v: r => r.o },
      { k: 'n', h: 'PJ', v: r => r.n },
      { k: 'v', h: 'V', v: r => r.v }, { k: 'e', h: 'E', v: r => r.e }, { k: 'd', h: 'D', v: r => r.d },
      { k: 'gf', h: 'GF', v: r => r.gf }, { k: 'ga', h: 'GC', v: r => r.ga },
      { k: 'last', h: 'Último', v: r => r.last.d, str: 1, f: r => `<button class="res ${r.last.r}" data-m="${r.last.id}" title="${fdate(r.last.d)}">${r.last.r}</button>` },
    ], h2hRows, 'n')}
    <p class="small">Incluye amistosos.</p>
  </section>`;
}

/* ---------- hojas ---------- */
function pitchSVG(m) {
  const lu = m.lu;
  const W = 390, H = 528;
  const lines = `
    <rect x="0" y="0" width="${W}" height="${H}" fill="var(--pitch)"/>
    ${[0, 1, 2, 3, 4, 5, 6, 7].map(i => i % 2 ? `<rect x="0" y="${i * H / 8}" width="${W}" height="${H / 8}" fill="var(--pitch-2)"/>` : '').join('')}
    <g fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2">
      <rect x="10" y="10" width="${W - 20}" height="${H - 20}"/>
      <line x1="10" x2="${W - 10}" y1="${H / 2}" y2="${H / 2}"/>
      <circle cx="${W / 2}" cy="${H / 2}" r="42"/>
      <rect x="95" y="10" width="200" height="70"/><rect x="95" y="${H - 80}" width="200" height="70"/>
      <rect x="150" y="10" width="90" height="24"/><rect x="150" y="${H - 34}" width="90" height="24"/>
    </g>`;
  const pl = lu.f.map(([k, pos, x, y]) => {
    const isM = m.mvp.includes(k);
    const nGoals = m.g[k] || 0;
    return `<g class="pl" data-p="${k}" tabindex="0" role="button" aria-label="${esc(pname(k))}, ${esc(pos)}">
      <circle cx="${x}" cy="${y}" r="20"/>
      <text class="n" x="${x}" y="${y + 7}">${esc(dorsal(k, m.s) || pos)}</text>
      <text class="t" x="${x}" y="${y + 38}">${esc(nick(k))}</text>
      ${nGoals ? `<circle cx="${x - 19}" cy="${y - 17}" r="10" fill="#fff" stroke="var(--pitch)" stroke-width="2"/><text class="gb" x="${x - 19}" y="${y - 12}">${nGoals}</text>` : ''}
      ${isM ? `<rect x="${x + 10}" y="${y - 28}" width="30" height="14" rx="3" fill="#fff"/><text class="mvp" x="${x + 25}" y="${y - 18}">MVP</text>` : ''}
    </g>`;
  }).join('');
  return `<svg class="pitch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Alineación ${esc(lu.t)}">${lines}${pl}</svg>`;
}

function chipsFor(obj) {
  return Object.entries(obj).sort((a, b) => b[1] - a[1]).map(([k, n]) => `<button class="chip" data-p="${k}">${esc(pname(k))}${n > 1 ? ` <b>${n}</b>` : ''}</button>`).join('');
}

      <h3 class="h3" style="margin-top:6px">Asistencias</h3>

      ${cards.length ? `<h3 class="h3" style="margin-top:6px">Tarjetas</h3><div class="chips">${cards.map(([t, k]) => typeof k === 'number' || /^\d+$/.test(k) ? `<button class="chip" data-p="${k}"><span class="card-${t}"></span>${esc(pname(k))}</button>` : `<span class="chip"><span class="card-${t}"></span>${esc(k)}</span>`).join('')}</div>` : ''}
      <p class="small">${m.src === 'excel' ? 'Goles, asistencias, MVP y portería según el Excel del equipo.' : 'Goles y asistencias según el foro de SportEasy.'}</p>

          <div><p class="eyebrow">Apuntados (${m.conv.length})</p><p style="margin-top:4px;font-size:14px">${m.conv.map(k => esc(nick(k))).join(', ')}</p></div>
          <div><p class="eyebrow">No van (${m.aus.length})</p><p style="margin-top:4px;font-size:14px;color:var(--muted)">${m.aus.map(k => esc(nick(k))).join(', ')}</p></div>
          <p class="small">El número blanco junto a cada jugador son sus goles. Alineación y asistencia de SportEasy.</p>
        </div>
      </div>
    </section>` : ''}
    ${notes.length ? `<section><h3 class="h3">Foro del partido</h3>${notes.map(n => `<div class="note"><span class="small">${esc(pname(n.a))} · ${fdate(n.t)} ${n.t.slice(11)}</span><pre>${esc(n.x.replace(/\*\*\*/g, ''))}</pre></div>`).join('')}</section>` : ''}
  `;
  showSheet(body, `Partido ${home} ${hs}–${as} ${away}`);
}

  const seasons = S.filter(s => s.players[k]);
  const rows = seasons.map(s => ({ label: s.id, g: s.players[k].g || 0, a: s.players[k].a || 0 }));

  const best = M.filter(m => (m.g[k] || 0) + (m.a[k] || 0) >= 3 || (m.g[k] || 0) >= 2).sort((a, b) => ((b.g[k] || 0) * 2 + (b.a[k] || 0)) - ((a.g[k] || 0) * 2 + (a.a[k] || 0)) || b.d.localeCompare(a.d)).slice(0, 8);
  const callups = M.filter(m => m.conv.includes(+k)).length, asked = M.filter(m => m.conv.includes(+k) || m.aus.includes(+k)).length;
  const isGK = c.gkm > 0 && c.ge > 0;
  const body = `
    <div class="ph">
      <span class="ph-num">${esc(dorsal(k, seasons.length ? seasons[seasons.length - 1].id : CUR) || '–')}</span>
      <div style="display:grid;gap:6px;min-width:0">
        <p class="eyebrow">${esc(p.posn || 'Jugador')}${p.nick ? ` · «${esc(p.nick)}» en el foro` : ''}</p>
        <h2 class="ph-name">${esc(p.n)}</h2>
        <p class="small">${esc(p.full)}${SQUAD.has(String(k)) ? ' · En la plantilla actual' : ''}</p>

    </div>
    <div class="tiles">
      <div class="tile"><b>${c.pj}</b><span>Partidos</span></div>
      <div class="tile"><b>${c.g}</b><span>Goles</span></div>
      <div class="tile"><b>${c.a}</b><span>Asistencias</span></div>
      <div class="tile"><b>${f2(pct(c.g + c.a, c.pj))}</b><span>G+A / partido</span></div>
      <div class="tile"><b>${c.mvp}</b><span>MVP</span></div>
      <div class="tile"><b>${c.mvpsd}</b><span>MVP sin derrota</span></div>
      ${isGK ? `<div class="tile"><b>${c.ge}</b><span>Goles encajados</span></div><div class="tile"><b>${c.cs}</b><span>Porterías a cero</span></div>` : ''}
    </div>
    <section>
      <h3 class="h3">Por temporada</h3>
      ${seasons.length ? `<div class="tbl-wrap"><table><thead><tr><th class="l">Temporada</th><th>Dorsal</th><th>PJ</th><th>Goles</th><th>Asist.</th><th>MVP</th><th>MVP s/d</th>${isGK ? '<th>GE</th>' : ''}</tr></thead><tbody>
      ${seasons.map(s => { const r = s.players[k]; return `<tr><td class="l"><button class="link" data-season="${s.id}">${s.id}</button>${s.current ? ' <span class="tag">en curso</span>' : ''}</td><td>${esc(dorsal(k, s.id))}</td><td>${r.pj}</td><td class="strong">${r.g}</td><td>${r.a}</td><td>${r.mvp}</td><td>${r.mvpsd}</td>${isGK ? `<td>${typeof r.ge === 'number' ? r.ge : ''}</td>` : ''}</tr>`; }).join('')}
      <tr style="border-top:2px solid var(--line)"><td class="l strong">Total</td><td></td><td class="strong">${c.pj}</td><td class="strong">${c.g}</td><td class="strong">${c.a}</td><td class="strong">${c.mvp}</td><td class="strong">${c.mvpsd}</td>${isGK ? `<td class="strong">${c.ge}</td>` : ''}</tr>
      </tbody></table></div>` : '<div class="empty">Todavía sin partidos oficiales registrados.</div>'}
    </section>
    ${rows.length > 1 ? `<section><div class="panel-head"><h3 class="h3">Evolución</h3>${legend(series)}</div><div class="chartpanel">${groupedBars(rows, series, { W: 560, H: 200, label: 'Goles y asistencias por temporada' })}</div></section>` : ''}
    ${best.length ? `<section><h3 class="h3">Mejores partidos</h3><div class="mlist">${best.map(m => `<button class="mrow" data-m="${m.id}"><span class="mrow-date">${fdate(m.d).replace(/ (\d{4})$/, '<br>$1')}</span><span class="mrow-comp">${esc(comp(m))}</span><span class="mrow-main"><span class="teams">${teamsHTML(m)}</span><span class="mrow-sub">${m.g[k] ? m.g[k] + (m.g[k] > 1 ? ' goles' : ' gol') : ''}${m.g[k] && m.a[k] ? ', ' : ''}${m.a[k] ? m.a[k] + (m.a[k] > 1 ? ' asistencias' : ' asistencia') : ''}</span></span><span class="res ${m.r}">${m.r}</span></button>`).join('')}</div></section>` : ''}
    <p class="small">Apuntado en SportEasy a ${callups} de los ${asked} partidos a los que fue convocado (amistosos incluidos).</p>
  `;
  showSheet(body, p.n);
}

const sheet = document.getElementById('sheet');
let lastFocus = null;
function showSheet(html, label) {
  document.getElementById('sheet-body').innerHTML = html;
  sheet.setAttribute('aria-label', label);
  if (sheet.hidden) { lastFocus = document.activeElement; sheet.hidden = false; document.body.style.overflow = 'hidden'; }
  sheet.querySelector('.sheet-panel').scrollTop = 0;
  sheet.querySelector('.sheet-x').focus({ preventScroll: true });
}
function closeSheet(nav = true) {
  if (sheet.hidden) return;
  sheet.hidden = true; document.body.style.overflow = '';
  if (nav) go(baseToken());
  if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
}
const baseToken = () => state.view === 'temporadas' ? 't' + state.season : (state.view || 'inicio');

/* ---------- render y rutas ---------- */
const main = document.getElementById('main');
function render(scroll) {
  const v = state.view || 'inicio';
  main.innerHTML = v === 'inicio' ? viewInicio() : v === 'temporadas' ? viewTemporadas() : v === 'partidos' ? viewPartidos() : v === 'jugadores' ? viewJugadores() : viewRecords();
  document.querySelectorAll('.nav button').forEach(b => { if (b.dataset.view === v) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  if (scroll) window.scrollTo(0, 0);
}
function go(token) {
  if (location.hash.slice(1) === token) route(); else location.hash = token;
}
function route() {
  const h = decodeURIComponent(location.hash.slice(1)) || 'inicio';
  let m;
  if ((m = h.match(/^m(\d+)$/)) && MB[m[1]]) {
    if (!state.view) { state.view = 'partidos'; render(true); }
    openMatch(+m[1]); return;
  }
  if ((m = h.match(/^jug(\d+)$/)) && P[m[1]]) {
    if (!state.view) { state.view = 'jugadores'; render(true); }
    openPlayer(m[1]); return;
  }
  const prevView = state.view, prevSeason = state.season;
  if ((m = h.match(/^t(\d{4}-\d{2})$/)) && SB[m[1]]) { state.view = 'temporadas'; state.season = m[1]; }
  else if (VIEWS.includes(h)) state.view = h;
  else state.view = 'inicio';
  closeSheet(false);
  render(prevView !== state.view || prevSeason !== state.season);
}
window.addEventListener('hashchange', route);

document.addEventListener('click', e => {
  const t = e.target.closest('[data-close],[data-m],[data-p],[data-view],[data-season],[data-sort],[data-jornada],[data-jf]');
  if (!t) return;
  if (t.hasAttribute('data-close')) { closeSheet(); return; }
  if (t.dataset.m) { go('m' + t.dataset.m); return; }
  if (t.dataset.p) { go('jug' + t.dataset.p); return; }
  if (t.dataset.view) { go(t.dataset.view === 'temporadas' ? 't' + state.season : t.dataset.view); return; }
  if (t.dataset.season) { go('t' + t.dataset.season); return; }
  if (t.dataset.sort) {
    const [id, k] = t.dataset.sort.split(':');
    const st = state.sort[id];
    state.sort[id] = st && st.k === k ? { k, d: -st.d } : { k, d: k === 'n' || k === 'o' ? 1 : -1 };
    render(); return;
  }
  if (t.dataset.jornada) { const [s, n] = t.dataset.jornada.split(':'); state.jornada[s] = +n; render(); return; }
  if (t.dataset.jf) { state.jf = t.dataset.jf; render(); return; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !sheet.hidden) closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.pl[data-p]')) { e.preventDefault(); go('jug' + e.target.dataset.p); }
});
let qTimer;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.pf) {
    state.pf[t.dataset.pf] = t.value;
    if (t.dataset.pf === 'q') { clearTimeout(qTimer); qTimer = setTimeout(() => { const pos = t.selectionStart; render(); const n = document.getElementById('f-q'); n.focus(); n.setSelectionRange(pos, pos); }, 180); }
    else render();
  }
  if (t.hasAttribute('data-js')) { state.js = t.value; render(); }
  if (t.hasAttribute('data-h2h')) { state.h2hq = t.value; clearTimeout(qTimer); qTimer = setTimeout(() => { const pos = t.selectionStart; render(); const n = document.getElementById('h2h-q'); n.focus(); n.setSelectionRange(pos, pos); }, 180); }
});

document.getElementById('foot').innerHTML = `<p><b style="color:var(--ink)">Florentineza S.A.</b> · Actualizada el ${fdate(D.generated + 'T00:00')}.</p>
<p>De 2021-22 a 2025-26, estadísticas oficiales del Excel del equipo (liga y copa). Desde 2026-27, todo sale de SportEasy: goles y asistencias del foro, alineaciones, apuntados y MVP. Resultados y clasificaciones de SportEasy. La web se actualiza sola cada 10 días.</p>`;

route();
})();
</script>
